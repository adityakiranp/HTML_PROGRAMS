<!DOCTYPE html>
<html>
<head>
    <title>HTML Headings Example</title>
</head>
<body>

    <h1>Heading 1 - Main Title (Largest)</h1>
    <h2>Heading 2 - Major Section</h2>
    <h3>Heading 3 - Sub-section</h3>
    <h4>Heading 4 - Minor Sub-section</h4>
    <h5>Heading 5 - Small Heading</h5>
    <h6>Heading 6 - Smallest Heading</h6>

    <p>This is a normal paragraph for comparison.</p>

</body>
</html>
